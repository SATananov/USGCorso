name: OTA preview publication (Android)

# GitHub only offers workflow_dispatch when this file is present on the default branch.
# Do not add it to main as a workaround; that requires separate approval.
on:
  workflow_dispatch:
    inputs:
      publish_update:
        description: Publish after validation (default is validation only)
        required: true
        type: boolean
        default: false
      confirmation:
        description: Enter exactly PUBLISH PREVIEW OTA to authorize publication
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ota-preview-publication
  cancel-in-progress: false

jobs:
  validate:
    name: Validate preview update inputs
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.config.outputs.channel }}
      eas_environment: ${{ steps.config.outputs.eas_environment }}
      runtime_version: ${{ steps.config.outputs.runtime_version }}
      app_version: ${{ steps.config.outputs.app_version }}
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0

      - name: Reject unauthorized ref or confirmation
        env:
          PUBLISH_UPDATE: ${{ inputs.publish_update }}
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/feature/eas-ota" ]; then
            echo "This workflow only accepts refs/heads/feature/eas-ota."
            exit 1
          fi
          if [ "$PUBLISH_UPDATE" = "true" ] && [ "$PUBLISH_CONFIRMATION" != "PUBLISH PREVIEW OTA" ]; then
            echo "Publication requires the exact confirmation: PUBLISH PREVIEW OTA."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Expo and preview profile configuration
        id: config
        env:
          PINNED_EAS_CLI_VERSION: 27.9.0
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const semver = require('semver');
          const readJson = (path) => {
            const contents = fs.readFileSync(path, 'utf8');
            return JSON.parse(contents.charCodeAt(0) === 0xfeff ? contents.slice(1) : contents);
          };
          const appConfig = readJson('app.json').expo;
          const eas = readJson('eas.json');
          const pkg = readJson('package.json');
          const lock = readJson('package-lock.json');
          const failures = [];
          const check = (condition, message) => { if (!condition) failures.push(message); };
          const projectId = appConfig?.extra?.eas?.projectId;
          const configuredUrl = appConfig?.updates?.url;
          const profile = eas?.build?.preview;
          const production = eas?.build?.production;
          const environment = profile?.environment;
          const updateRuntime = appConfig?.runtimeVersion;
          let runtimeVersion;

          if (typeof updateRuntime === 'string' && updateRuntime.length > 0) {
            runtimeVersion = updateRuntime;
          } else if (updateRuntime?.policy === 'appVersion' && typeof appConfig?.version === 'string') {
            runtimeVersion = appConfig.version;
          }

          check(Boolean(projectId) && /^[0-9a-f-]{36}$/i.test(projectId), 'A valid Expo project ID must be present in app.json.');
          check(configuredUrl === `https://u.expo.dev/${projectId}`, 'Expo Updates URL must match the project ID in app.json.');
          check(appConfig?.plugins?.includes('expo-updates'), 'The expo-updates config plugin is missing from app.json.');
          check(Boolean(runtimeVersion), 'Could not derive a supported runtime version from app.json.');
          check(profile?.channel === 'preview', 'The preview build profile must use the preview channel.');
          check(['development', 'preview'].includes(environment), 'The preview build profile must select a non-production EAS environment.');
          check(production?.channel === 'production', 'The production build profile must remain on the production channel.');
          check(typeof pkg.dependencies?.['expo-updates'] === 'string', 'expo-updates must remain a direct dependency.');
          check(lock.packages?.['']?.dependencies?.['expo-updates'] === pkg.dependencies?.['expo-updates'], 'package-lock.json does not match the expo-updates dependency.');
          check(semver.satisfies(process.version, require('expo/package.json').engines.node), 'The pinned Node.js version is incompatible with Expo.');
          check(semver.satisfies(process.env.PINNED_EAS_CLI_VERSION, eas?.cli?.version), 'The pinned EAS CLI version does not satisfy eas.json cli.version.');

          for (const [directory, expectedName] of [['modules/usg-ocr', 'usg-ocr'], ['modules/usg-translate', 'usg-translate']]) {
            const localModule = readJson(`${directory}/package.json`);
            check(localModule.name === expectedName, `${directory}/package.json has an unexpected package name.`);
          }

          const dynamicConfig = fs.readFileSync('app.config.js', 'utf8');
          check(dynamicConfig.includes("require('./app.json')") && dynamicConfig.includes('...base'), 'app.config.js must preserve app.json as its source configuration.');
          check(!/\b(runtimeVersion|updates|channel|version|extra)\s*:/.test(dynamicConfig), 'app.config.js must not override OTA identity, runtime, version, or channel values.');

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }

          const outputs = {
            channel: profile.channel,
            eas_environment: environment,
            runtime_version: runtimeVersion,
            app_version: appConfig.version,
          };
          for (const [key, value] of Object.entries(outputs)) {
            if (typeof value !== 'string' || /[\r\n]/.test(value)) {
              throw new Error(`Invalid configuration output: ${key}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          console.log('Preview profile, project identity, runtime, dependency, and module metadata checks passed.');
          NODE

      - name: Verify expo-updates installation
        run: npm ls expo-updates --depth=0

      - name: Verify Android Expo module autolinking
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const output = execFileSync('node_modules/.bin/expo-modules-autolinking', ['resolve', '--platform', 'android', '--json'], { encoding: 'utf8' });
          const packages = new Set(JSON.parse(output).modules.map((module) => module.packageName));
          const missing = ['usg-ocr', 'usg-translate'].filter((name) => !packages.has(name));
          if (missing.length) {
            console.error(`Android autolinking did not resolve: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log('Both local Expo modules resolve for Android.');
          NODE

      - name: Parse tracked JavaScript and JSX
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const parser = require('@babel/parser');
          const files = execFileSync('git', ['ls-files', '-z', '--', '*.js', '*.jsx'], { encoding: 'buffer' })
            .toString('utf8')
            .split('\0')
            .filter(Boolean);
          const failures = [];
          for (const file of files) {
            try {
              parser.parse(fs.readFileSync(file, 'utf8'), { sourceType: 'unambiguous', plugins: ['jsx'] });
            } catch (error) {
              failures.push(`${file}:${error.loc?.line ?? 0}:${error.loc?.column ?? 0} ${error.message}`);
            }
          }
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`Parsed ${files.length} tracked JavaScript/JSX files.`);
          NODE

      - name: Check branch changes for whitespace errors
        run: |
          base_commit="$(git merge-base origin/main HEAD)"
          git diff --check "$base_commit" HEAD

  verify-preview-channel:
    name: Verify preview mapping and optionally publish
    needs: validate
    runs-on: ubuntu-latest
    environment:
      # Configure this GitHub Environment for feature/eas-ota only, with EXPO_TOKEN as an environment secret.
      # Require a reviewer and prevent self-review where supported. Do not add production credentials.
      name: ota-preview
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0

      - name: Install locked dependencies
        run: npm ci

      - name: Verify remote EAS channel mapping
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PREVIEW_CHANNEL: ${{ needs.validate.outputs.channel }}
          EAS_ENVIRONMENT: ${{ needs.validate.outputs.eas_environment }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "The ota-preview environment must provide EXPO_TOKEN."
            exit 1
          fi
          GOOGLE_MAPS_ANDROID_API_KEY=bootstrap-placeholder npx --yes "eas-cli@27.9.0" env:exec "$EAS_ENVIRONMENT" 'npx --yes "eas-cli@27.9.0" channel:view "$PREVIEW_CHANNEL" --json --non-interactive --limit=100' --non-interactive > "$RUNNER_TEMP/eas-channel.json"
          node - "$RUNNER_TEMP/eas-channel.json" "$PREVIEW_CHANNEL" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedChannel] = process.argv.slice(2);
          const response = JSON.parse(fs.readFileSync(file, 'utf8'));
          const channel = response.currentPage;
          if (!channel || channel.name !== expectedChannel || typeof channel.branchMapping !== 'string') {
            throw new Error('Remote EAS channel response is missing the expected preview channel mapping.');
          }
          const mapping = JSON.parse(channel.branchMapping);
          const entries = mapping?.data;
          if (!Array.isArray(entries) || entries.length !== 1 || entries[0].branchMappingLogic !== 'true') {
            throw new Error('Preview channel must point directly to exactly one EAS branch.');
          }
          const branch = (channel.updateBranches || []).find((item) => item.id === entries[0].branchId);
          if (branch?.name !== expectedChannel) {
            throw new Error('Preview channel is not mapped directly to the preview EAS branch.');
          }
          console.log('Remote preview channel mapping verified.');
          NODE

      - name: Publish Android preview update
        if: ${{ inputs.publish_update }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PREVIEW_CHANNEL: ${{ needs.validate.outputs.channel }}
          EAS_ENVIRONMENT: ${{ needs.validate.outputs.eas_environment }}
          RUNTIME_VERSION: ${{ needs.validate.outputs.runtime_version }}
          APP_VERSION: ${{ needs.validate.outputs.app_version }}
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/feature/eas-ota" ] || [ "$PREVIEW_CHANNEL" != "preview" ]; then
            echo "Publication is restricted to feature/eas-ota and the preview channel."
            exit 1
          fi
          if [ "$PUBLISH_CONFIRMATION" != "PUBLISH PREVIEW OTA" ]; then
            echo "Publication requires the exact confirmation: PUBLISH PREVIEW OTA."
            exit 1
          fi
          if [ "$EAS_ENVIRONMENT" = "production" ] || [ -z "$EXPO_TOKEN" ]; then
            echo "A non-production EAS environment and EXPO_TOKEN are required."
            exit 1
          fi
          GOOGLE_MAPS_ANDROID_API_KEY=bootstrap-placeholder npx --yes "eas-cli@27.9.0" env:exec "$EAS_ENVIRONMENT" 'if [ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ] || [ "$GOOGLE_MAPS_ANDROID_API_KEY" = "bootstrap-placeholder" ]; then echo "EAS development Maps key is unavailable; refusing OTA publication."; exit 1; fi; npx --yes "eas-cli@27.9.0" update --channel "$PREVIEW_CHANNEL" --environment "$EAS_ENVIRONMENT" --platform android --message "Preview OTA ${APP_VERSION} runtime ${RUNTIME_VERSION} (${GITHUB_SHA:0:7})" --non-interactive' --non-interactive

      - name: Finish validation-only run
        if: ${{ !inputs.publish_update }}
        run: echo "Validation-only run completed; no OTA update was published."
